# Checks the game on pull requests, and checks and publishes the build to GitHub Pages on pushes to
# main. Both runs are filtered by path: a push that changes nothing the build is made from, or a pull
# request that changes nothing the checks read (docs other than KEYS.md, specs, CLAUDE.md, .claude/,
# the backlog), runs nothing. Actions has no YAML anchors, so the push list is repeated below it.
name: Deploy

on:
  push:
    branches: [main]
    # only what the published build is made from
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  pull_request:
    # the above, plus what the checks and the e2e suite run on (unit tests read docs/KEYS.md and
    # look for the art sources the baked art came from)
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
      - 'test/**'
      - 'scripts/**'
      - 'eslint.config.js'
      - 'playwright.config.ts'
      - 'docs/KEYS.md'
      - 'art/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # lint, typecheck, unit tests, build, size budget
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
